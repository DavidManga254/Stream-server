plugins {
    id 'java'
    id 'application'
}

toolchains {
    languageVersion = JavaLanguageVersion.of(21)
}

application {
    mainClass = 'Main' 
}

repositories {
    mavenCentral()
}

dependencies {
    implementation 'com.google.code.gson:gson:2.10.1'
    implementation 'com.mysql:mysql-connector-j:8.3.0'
    implementation 'org.hibernate.orm:hibernate-core:6.4.0.Final'
}

jar {
    archiveFileName = 'stream-server.jar'
    manifest {
        attributes 'Main-Class': 'Main'
    }
}

sourceSets {
    main {
        java {
            // tell Gradle your source files are in the root, not src/main/java
            srcDirs = ['.']
            exclude 'build/**'
            exclude '.gradle/**'
        }
        resources {
            srcDirs = ['resources']
        }
    }
}