plugins {
    id 'java'
    id 'application'
}

application {
    mainClass = 'Main' 
}

repositories {
    mavenCentral()
}

dependencies {
    implementation 'com.google.code.gson:gson:2.10.1'
}

jar {
    archiveFileName = 'stream-server.jar'
    manifest {
        attributes 'Main-Class': 'Main'
    }
}

sourceSets {
    main {
        java {
            // tell Gradle your source files are in the root, not src/main/java
            srcDirs = ['.']
            exclude 'build/**'
            exclude '.gradle/**'
        }
    }
}